services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: airward-broker
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT estándar (para los ESP32)
      - "9001:9001"   # MQTT sobre WebSockets (lo usa la página web)
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  web:
    image: nginx:alpine
    container_name: airward-web
    restart: unless-stopped
    ports:
      - "8080:80"     # la página: http://IP-de-la-PC:8080
    volumes:
      - ./web:/usr/share/nginx/html:ro
