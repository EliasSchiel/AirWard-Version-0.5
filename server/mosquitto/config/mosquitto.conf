listener 1883
listener 9001
protocol websockets

# Sin usuario/contraseña para simplificar el desarrollo y la expo.
# Antes de exponer el broker fuera de tu red local, cambiar esto
# a allow_anonymous false y configurar un password_file.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
